<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone dashboard · Drone Tag</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app-header"></div>
<main class="page stack">
  <div class="page-head">
    <div><h1>Drone dashboard</h1><p class="muted">Flight path, live position and images of one drone. Times are Indian Standard Time.</p></div>
    <div class="chips"><span class="chip hidden" id="track-chip"></span><span class="chip alt" id="updated">–</span></div>
  </div>

  <section class="card">
    <form class="actions" id="search-form">
      <label class="field grow">Tracker ID <input id="tracker" placeholder="Enter a Tracker ID, e.g. DRONE-01" autocapitalize="characters"></label>
      <button class="btn btn-primary" type="submit" id="fetch-btn">Show drone</button>
      <button class="btn btn-accent" type="button" id="csv-btn">Export CSV</button>
      <button class="btn btn-outline" type="button" id="zip-btn">Export images</button>
    </form>
    <div id="status" class="hidden" style="margin-top:12px"></div>
  </section>

  <section class="card">
    <h2 class="section-title">Drone details</h2>
    <div class="table-wrap">
      <table class="info">
        <thead><tr><th>Tracker ID</th><th>Drone UIN</th><th>Category</th><th>Application</th><th>Autonomy</th><th>Range</th><th>Owner</th></tr></thead>
        <tbody id="info-body"><tr><td colspan="7" class="muted">Enter a Tracker ID to load a drone.</td></tr></tbody>
      </table>
    </div>
    <div class="chips" id="stats" style="margin-top:12px"></div>
  </section>

  <section class="stack" style="gap:10px">
    <div class="page-head">
      <div><h2 class="section-title" style="margin:0">Flight path</h2><p class="muted" id="track-note" style="font-size:13.5px"></p></div>
      <label class="field" style="min-width:min(100%,320px)">Flight <select id="session"><option value="">Latest flight</option></select></label>
    </div>
    <div id="map" class="map"></div>
  </section>

  <section>
    <div class="page-head" style="margin-bottom:10px"><h2 class="section-title" style="margin:0">Images</h2><span class="muted" id="img-count"></span></div>
    <div id="images" class="images-grid"><div class="empty">Images of the drone appear here.</div></div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Image">
  <img id="lb-img" alt="Drone image">
  <div class="cap" id="lb-cap"></div>
  <div class="row"><a class="btn btn-accent" id="lb-open" target="_blank" rel="noopener">Open original</a><button class="btn btn-outline" id="lb-close" type="button">Close</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/js/common.js"></script>
<script>
(async () => {
  const me = await DT.header('drone');
  const $ = id => document.getElementById(id);
  const REFRESH_MS = 5000;

  // ---- map: one path line and at most one start pin, one arrow and one end pin ----
  const map = L.map('map').setView([22.6, 72.5], 7);
  DT.baseLayers(map);
  DT.legend(map, ['start', 'live', 'end']);
  const pathLine = L.polyline([], { color: '#b45309', weight: 4, opacity: 0.9 }).addTo(map);
  const dots = L.layerGroup().addTo(map);
  const marks = { start: null, arrow: null, end: null };
  let arrowDeg = null;
  let dotsKey = '';
  let fittedFor = '';

  // Creates the marker the first time, afterwards only moves it (no duplicates).
  function place(kind, pos, icon, html) {
    const ll = [pos.lat, pos.lon];
    if (!marks[kind]) marks[kind] = L.marker(ll, { icon, zIndexOffset: kind === 'arrow' ? 1000 : 0 }).addTo(map).bindPopup(html);
    else { marks[kind].setLatLng(ll); marks[kind].setPopupContent(html); }
    return marks[kind];
  }
  function drop(kind) {
    if (marks[kind]) { map.removeLayer(marks[kind]); marks[kind] = null; }
    if (kind === 'arrow') arrowDeg = null;
  }
  function clearTrack() {
    ['start', 'arrow', 'end'].forEach(drop);
    pathLine.setLatLngs([]);
    dots.clearLayers();
    dotsKey = '';
  }

  const validFix = p => Number.isFinite(p.lat) && Number.isFinite(p.lon) && Math.abs(p.lat) <= 90 && Math.abs(p.lon) <= 180;
  const duration = ms => ms < 120000 ? `${Math.round(ms / 1000)} seconds` : `${Math.round(ms / 6000) / 10} minutes`;

  let current = '';
  let chosen = '';            // '' = always follow the latest flight
  let photosKey = '';

  function renderInfo(id, drone) {
    const cell = v => `<td>${v ? DT.esc(v) : '<span class="muted">–</span>'}</td>`;
    $('info-body').innerHTML = drone
      ? `<tr>${cell(id)}${cell(drone.uin)}${cell(drone.category)}${cell(drone.application)}${cell(drone.autonomy)}${cell(drone.range)}${cell(drone.owner)}</tr>`
      : `<tr>${cell(id)}<td colspan="6" class="muted">This Tracker ID is not registered by any user (data is still shown).</td></tr>`;
  }

  function fillSessions(sessions) {
    const label = s => `Flight ${s.number} · ${DT.ist(s.startedAt).slice(0, 16)}` +
      (s.status === 'live' ? ' → live now' : ` → ${DT.ist(s.endedAt).slice(11, 16)}`);
    const html = '<option value="">Latest flight</option>' +
      sessions.slice().reverse().map(s => `<option value="${DT.esc(s.id)}">${DT.esc(label(s))}</option>`).join('');
    if ($('session').innerHTML !== html) {
      $('session').innerHTML = html;
      $('session').value = sessions.some(s => s.id === chosen) ? chosen : '';
    }
  }

  function renderTrack(id, body) {
    const sessions = body.sessions || [];
    fillSessions(sessions);
    const s = sessions.find(x => x.id === chosen) || sessions[sessions.length - 1];
    const chip = $('track-chip');
    if (!s) {
      clearTrack();
      chip.className = 'chip hidden';
      $('track-note').textContent = 'No GPS position received from this drone yet.';
      return null;
    }

    // This flight's points only, so an older flight never mixes into the current one.
    const pts = (body.points || []).filter(p => p.seq >= s.firstSeq && p.seq <= s.lastSeq && validFix(p));
    pathLine.setLatLngs(pts.map(p => [p.lat, p.lon]));
    const key = `${s.id}|${pts.length}`;
    if (key !== dotsKey) {
      dots.clearLayers();
      pts.slice(1, -1).forEach(p => {
        L.circleMarker([p.lat, p.lon], { radius: 3.5, color: '#b45309', weight: 1.5, fillColor: '#fff', fillOpacity: 1 })
          .addTo(dots).bindPopup(DT.mapPopup(id, p.receivedAt));
      });
      dotsKey = key;
    }

    // Green start pin: the first position of the flight, never moves.
    place('start', s.start, DT.markers.start(), DT.mapPopup(id, s.start.receivedAt));

    if (s.status === 'live') {
      // Live: arrow at the latest position; no red end pin yet.
      drop('end');
      const deg = s.headingDeg == null ? 0 : s.headingDeg;
      const arrow = place('arrow', s.current, DT.markers.arrow(deg), DT.mapPopup(id, s.current.receivedAt));
      if (deg !== arrowDeg) { arrow.setIcon(DT.markers.arrow(deg)); arrowDeg = deg; }
      if (fittedFor === s.id && !map.getBounds().contains(arrow.getLatLng())) map.panTo(arrow.getLatLng(), { animate: false });
      chip.className = 'chip live';
      chip.textContent = 'Live · tracking';
      $('track-note').textContent = `Flight ${s.number} is live. Last position ${DT.ist(s.lastSeenAt)}. ` +
        `It is marked as ended if no data arrives by ${DT.ist(s.offlineAt).slice(11)}.`;
    } else {
      // Ended: red pin fixed at the last position received.
      drop('arrow');
      place('end', s.end, DT.markers.end(), DT.mapPopup(id, s.end.receivedAt));
      chip.className = 'chip ended';
      chip.textContent = 'Tracking ended';
      $('track-note').textContent = `Flight ${s.number} ended. Last position ${DT.ist(s.endedAt)}. ` +
        `A flight ends when no data arrives for ${duration(body.offlineAfterMs)}.`;
    }

    if (fittedFor !== s.id && pts.length) {
      map.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lon])), { padding: [50, 50], maxZoom: 17 });
      fittedFor = s.id;
    }
    return { s, pts };
  }

  function renderImages(id, photos) {
    $('img-count').textContent = photos.length ? `${photos.length} image${photos.length === 1 ? '' : 's'}, newest first` : '';
    if (!photos.length) { $('images').innerHTML = '<div class="empty">No images from this drone yet.</div>'; return; }
    $('images').innerHTML = photos.slice().reverse().map(p => `
      <figure class="img-card" style="margin:0">
        <button type="button" data-src="${DT.esc(p.url)}" data-cap="${DT.esc(id)} · ${DT.ist(p.receivedAt)}">
          <img src="${DT.esc(p.url)}" alt="Image from ${DT.esc(id)}" loading="lazy">
        </button>
        <figcaption class="cap"><b>${DT.esc(id)}</b><br><span class="muted">${DT.ist(p.receivedAt)}</span></figcaption>
      </figure>`).join('');
  }

  async function load(id, { quiet = false } = {}) {
    id = id.trim();
    if (!id) { DT.setStatus($('status'), 'Enter a Tracker ID.', 'warn'); return; }
    if (id.toLowerCase() !== current.toLowerCase()) {
      clearTrack();
      fittedFor = '';
      chosen = '';
      photosKey = '';
    }
    current = id;
    if (!quiet) DT.setStatus($('status'), `Loading ${id}…`, 'info');
    history.replaceState(null, '', '/drone?tracker=' + encodeURIComponent(id));

    const [dataRes, regRes] = await Promise.all([DT.api('/api/data/' + encodeURIComponent(id)), DT.api('/api/drones')]);
    if (id !== current) return;   // another drone was chosen meanwhile
    const drone = regRes.ok ? regRes.body.drones.find(d => d.trackerId.toLowerCase() === id.toLowerCase()) : null;
    renderInfo(id, drone);

    if (!dataRes.ok) {
      clearTrack();
      fillSessions([]);
      $('track-chip').className = 'chip hidden';
      $('track-note').textContent = '';
      renderImages(id, []);
      photosKey = '';
      $('stats').innerHTML = '';
      $('updated').textContent = 'Checked ' + DT.ist(new Date()).slice(11);
      DT.setStatus($('status'), dataRes.status === 404 ? `No data from ${id} yet. Make sure the drone tag sends this exact Tracker ID.` : 'Could not load the data. Retrying automatically.', dataRes.status === 404 ? 'warn' : 'err');
      return;
    }
    const body = dataRes.body;
    const photos = body.photos || [];
    const track = renderTrack(id, body);
    // Images are redrawn only when they change, so the page does not jump while you scroll.
    const key = photos.length + '|' + (photos.length ? photos[photos.length - 1].id : '');
    if (key !== photosKey) { renderImages(id, photos); photosKey = key; }

    const s = track && track.s;
    $('stats').innerHTML = `
      <span class="chip">${(body.sessions || []).length} flight${(body.sessions || []).length === 1 ? '' : 's'}</span>
      <span class="chip">${track ? track.pts.length : 0} positions in this flight</span>
      <span class="chip alt">${photos.length} images</span>
      ${s ? `<span class="chip">Started ${DT.ist(s.startedAt)}</span><span class="chip">Last seen ${DT.ist(s.lastSeenAt)}</span>` : ''}`;
    $('updated').textContent = 'Updated ' + DT.ist(new Date()).slice(11);
    if (!quiet) DT.setStatus($('status'), `Showing ${id}: ${(body.sessions || []).length} flight(s) and ${photos.length} images.`, 'ok');
  }

  async function download(kind) {
    if (!current) return DT.setStatus($('status'), 'Load a drone first.', 'warn');
    const url = `/api/export/${encodeURIComponent(current)}/${kind === 'csv' ? 'csv' : 'images.zip'}`;
    // Check first so a missing export shows a message instead of a broken download.
    const head = await fetch(url, { method: 'HEAD', credentials: 'same-origin' });
    if (!head.ok) return DT.setStatus($('status'), kind === 'csv' ? `No positions to export for ${current}.` : `No images to export for ${current}.`, 'warn');
    location.href = url;
  }

  $('search-form').addEventListener('submit', e => { e.preventDefault(); load($('tracker').value); });
  $('csv-btn').addEventListener('click', () => download('csv'));
  $('zip-btn').addEventListener('click', () => download('zip'));
  $('session').addEventListener('change', () => {
    chosen = $('session').value;
    clearTrack();
    fittedFor = '';
    if (current) load(current, { quiet: true });
  });

  // Image viewer
  $('images').addEventListener('click', e => {
    const btn = e.target.closest('button[data-src]');
    if (!btn) return;
    $('lb-img').src = btn.dataset.src;
    $('lb-open').href = btn.dataset.src;
    $('lb-cap').textContent = btn.dataset.cap;
    $('lightbox').classList.add('open');
  });
  const closeBox = () => $('lightbox').classList.remove('open');
  $('lb-close').addEventListener('click', closeBox);
  $('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeBox(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBox(); });

  // Start with ?tracker=…, or the signed-in user's own drone. Then refresh by itself.
  const start = new URLSearchParams(location.search).get('tracker') || (me && me.drone.trackerId) || '';
  $('tracker').value = start;
  if (start) await load(start);
  setInterval(() => { if (current) load(current, { quiet: true }); }, REFRESH_MS);
})();
</script>
</body>
</html>
